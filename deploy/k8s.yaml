# coral K8s 部署示例
# 单副本：多副本各自独立缓存、首访各自冷，留待后续扩展
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coral-config
data:
  coral.toml: |
    [server]
    port = 3000
    bind = "0.0.0.0"   # 容器部署必须 0.0.0.0

    [content]
    root = "/content"          # PVC 挂载点
    exclude = []
    draft = false

    [tree]
    initial_depth = 2
    expand_depth = 1

    [cache]
    dir = "/cache"             # emptyDir（纯派生数据，可随时删除）

    [log]
    format = "json"            # K8s 采集
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coral
spec:
  replicas: 1                  # 单副本：多副本各自独立缓存、首访各自冷
  selector:
    matchLabels:
      app: coral
  template:
    metadata:
      labels:
        app: coral
    spec:
      # 优雅停机余量：停机上限 10s + K8s 强杀余量
      terminationGracePeriodSeconds: 15
      containers:
        - name: coral
          image: coral:latest
          ports:
            - containerPort: 3000
          args: ["--config", "/etc/coral/coral.toml"]
          volumeMounts:
            - name: config
              mountPath: /etc/coral
              readOnly: true
            - name: cache
              mountPath: /cache        # 缓存可写卷（emptyDir）
            - name: content
              mountPath: /content
              readOnly: true           # 内容只读
          readinessProbe:              # 就绪 = 索引构建完成
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:               # 存活 = 进程可用
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"          # 常驻内存预算 ≤500MB
      volumes:
        - name: config
          configMap:
            name: coral-config
        - name: cache
          emptyDir: {}
        - name: content
          persistentVolumeClaim:
            claimName: coral-content
            # NFS 网络挂载时自动降级 Poll（statfs 检测）
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coral-content
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 2Gi
